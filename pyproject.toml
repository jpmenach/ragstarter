[project]
name = "ragstarter"
version = "0.2.0"
description = "Reusable local-first RAG engine, demoed with a veterinary clinic WhatsApp bot"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "llama-index-core>=0.14.24",
    "llama-index-embeddings-huggingface>=0.8.0",
    "llama-index-llms-ollama>=0.11.0",
    "llama-index-vector-stores-chroma>=0.6.0",
]

[build-system]
requires = ["uv_build>=0.12.16,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
demo = [
    "gradio>=6.29.1",
]

# Dependency groups are never part of the published package, so making the demo group a
# default only affects `uv sync` / `uv run` inside this repo.
[tool.uv]
default-groups = ["demo"]
